[project]
name = "nplc"
version = "0.1.0"
description = "Deterministic natural-language-pseudocode to Python compiler."
readme = "README.md"
authors = [
    { name = "William Chastain", email = "williamchastain2005@gmail.com" }
]
requires-python = ">=3.12"
dependencies = []

[project.scripts]
nplc = "nplc.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "mypy>=2.1.0",
    "pytest>=9.1.1",
    "ruff>=0.15.20",
]

[tool.ruff]
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src", "tests"]
mypy_path = "src"
explicit_package_bases = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
